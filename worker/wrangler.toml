name = "sentinel-discord-bot"
main = "src/index.js"
compatibility_date = "2024-09-23"

# One cron trigger checking for new pending proposals across every active
# license (including your own admin bot). Workers Paid allows down to 1 minute.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sentinel-bot-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Secrets (set with `wrangler secret put <NAME>`, never committed here):
#   ADMIN_APPLICATION_ID     -- your one Discord Application's id
#   ADMIN_PUBLIC_KEY         -- your one Discord Application's public key
#   ADMIN_BOT_TOKEN          -- your one bot token, shared by every customer's channel
#   ADMIN_BOT_USER_ID        -- your bot's own user id (Bot tab, below the token) —
#                               needed to grant the bot access to new private channels
#   ADMIN_GUILD_ID           -- the server all customer channels get created in (required)
#   ADMIN_CUSTOMER_CATEGORY_ID -- optional category id to nest customer channels under
#   ADMIN_CHANNEL_ID         -- your own channel for your own proposals
#   ADMIN_ALLOWED_USER_ID    -- who can click Approve/Reject on your own proposals
#   ADMIN_USER_ID            -- who can run /license commands (usually same as above)
#   ADMIN_SENTINEL_BASE_URL  -- your own Sentinel's tunnel URL
